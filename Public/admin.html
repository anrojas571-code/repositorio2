<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Administrador</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --danger: #ef4444;
            --warning-bg: #fef3c7;
            --warning-text: #b45309;
            --alert-bg: #fee2e2;
            --alert-text: #991b1b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-container {
            width: 100%;
            max-width: 900px;
        }

        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 36px 30px;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            color: #475569;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.field-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            outline: none;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-weight: 700;
            cursor: pointer;
        }

        .header-panel {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px 30px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stat-card {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            padding: 16px 24px;
            border-radius: var(--radius-md);
            text-align: center;
        }

        .content-panel {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 26px 30px;
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            flex-wrap: wrap;
            gap: 10px;
        }

        .btn-group {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .btn {
            padding: 10px 14px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-refresh {
            background: #f1f5f9;
            color: #334155;
        }

        .btn-export-csv {
            background: #ecfdf5;
            color: #047857;
            border: 1px solid #a7f3d0;
        }

        .btn-history {
            background: #fef3c7;
            color: #b45309;
            border: 1px solid #fde68a;
        }

        .btn-danger {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fca5a5;
        }

        .users-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user-item {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .user-item.exceeded {
            border: 2px solid var(--danger);
            background: #fff5f5;
        }

        .user-detail {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #06b6d4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }

        .user-data h3 {
            font-size: 16px;
            font-weight: 800;
            color: #0f172a;
        }

        .user-data p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 3px;
        }

        .badges-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge-mods {
            background: var(--warning-bg);
            color: var(--warning-text);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
        }

        .badge-alert {
            background: var(--alert-bg);
            color: var(--alert-text);
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 800;
            border: 1px solid #fca5a5;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% {
                opacity: 1;
            }

            50% {
                opacity: 0.6;
            }

            100% {
                opacity: 1;
            }
        }

        .btn-delete-user {
            background: transparent;
            color: #94a3b8;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 8px;
        }

        .btn-delete-user:hover {
            color: var(--danger);
        }

        /* MODAL */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(15, 23, 42, 0.7);
            backdrop-filter: blur(4px);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: all 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-card {
            background: #ffffff;
            border-radius: var(--radius-lg);
            width: 90%;
            max-width: 500px;
            padding: 24px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 12px;
        }

        .modal-close {
            background: transparent;
            border: none;
            font-size: 20px;
            color: #94a3b8;
            cursor: pointer;
        }

        .modal-body {
            max-height: 300px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .history-item {
            background: #f8fafc;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            font-size: 13px;
            font-weight: 600;
            color: #334155;
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <!-- LOGIN ADMIN -->
        <div id="vistaLoginAdmin" class="login-card">
            <div style="font-size: 40px; color: var(--primary); margin-bottom: 10px;">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2>Acceso Administrador</h2>
            <p style="font-size: 13px; color: var(--text-muted); margin-bottom: 20px;">Ingresa tus credenciales</p>

            <form onsubmit="event.preventDefault(); iniciarSesionAdmin();">
                <div class="form-group">
                    <label>Usuario Administrador</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user field-icon"></i>
                        <input type="text" id="adminUser" placeholder="Admin" required>
                    </div>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" id="adminPass" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn-primary">Ingresar al Panel</button>
            </form>
        </div>

        <!-- PANEL DE CONTROL -->
        <div id="vistaPanelAdmin" style="display: none;">

            <div class="header-panel">
                <div>
                    <h1 style="font-size: 20px; font-weight: 800;"><i class="fa-solid fa-code"></i> Panel de Auditoría y
                        Control</h1>
                    <p style="font-size: 13px; color: var(--text-muted);">Monitoreo y alertas de ediciones de perfil</p>
                </div>
                <div style="display: flex; gap: 12px; align-items: center;">
                    <div class="stat-card">
                        <div style="font-size: 28px; font-weight: 800;" id="totalUsuariosCount">0</div>
                        <div style="font-size: 11px; font-weight: 600; text-transform: uppercase;">Usuarios</div>
                    </div>
                    <button onclick="cerrarSesionAdmin()" class="btn btn-danger" style="height: fit-content;"><i
                            class="fa-solid fa-power-off"></i></button>
                </div>
            </div>

            <div class="content-panel">
                <div class="controls-bar">
                    <span style="font-weight: 700; font-size: 15px;">Directorio de Usuarios</span>
                    <div class="btn-group">
                        <button onclick="cargarDatos()" class="btn btn-refresh"><i
                                class="fa-solid fa-rotate-right"></i></button>
                        <button onclick="exportarCSV()" class="btn btn-export-csv"><i class="fa-solid fa-file-csv"></i>
                            CSV</button>
                        <button onclick="abrirModalDescargas()" class="btn btn-history"><i
                                class="fa-solid fa-clock-rotate-left"></i> Descargas</button>
                        <button onclick="vaciarBaseDeDatos()" class="btn btn-danger"><i
                                class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>

                <div id="contenedorLista" class="users-list"></div>
            </div>

        </div>

    </div>

    <!-- MODALS -->
    <div id="modalGenerico" class="modal-overlay">
        <div class="modal-card">
            <div class="modal-header">
                <h2 id="modalTitulo" style="font-size: 16px; font-weight: 800;"></h2>
                <button onclick="cerrarModalGenerico()" class="modal-close"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div id="modalContenido" class="modal-body"></div>
        </div>
    </div>

    <script>
        const ADMIN_SESSION_KEY = 'admin_session_active';
        let usuariosCargados = [];

        document.addEventListener('DOMContentLoaded', () => {
            if (sessionStorage.getItem(ADMIN_SESSION_KEY)) mostrarPanelAdmin();
        });

        async function iniciarSesionAdmin() {
            const usuario = document.getElementById('adminUser').value.trim();
            const clave = document.getElementById('adminPass').value.trim();

            try {
                const res = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, clave })
                });

                if (res.ok) {
                    sessionStorage.setItem(ADMIN_SESSION_KEY, 'true');
                    mostrarPanelAdmin();
                } else {
                    alert('Credenciales incorrectas');
                }
            } catch (err) {
                alert('Error de conexión');
            }
        }

        function mostrarPanelAdmin() {
            document.getElementById('vistaLoginAdmin').style.display = 'none';
            document.getElementById('vistaPanelAdmin').style.display = 'block';
            cargarDatos();
        }

        function cerrarSesionAdmin() {
            sessionStorage.removeItem(ADMIN_SESSION_KEY);
            document.getElementById('vistaPanelAdmin').style.display = 'none';
            document.getElementById('vistaLoginAdmin').style.display = 'block';
        }

        async function cargarDatos() {
            try {
                const res = await fetch('/api/usuarios');
                usuariosCargados = await res.json();
                document.getElementById('totalUsuariosCount').textContent = usuariosCargados.length;

                const contenedor = document.getElementById('contenedorLista');
                if (!usuariosCargados || usuariosCargados.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center; padding: 20px; color:#64748b;">No hay usuarios registrados.</p>';
                    return;
                }

                let html = '';
                usuariosCargados.forEach((u, i) => {
                    const inicial = u.usuario ? u.usuario.charAt(0).toUpperCase() : '?';
                    const mods = u.contadorModificaciones || 0;
                    const haExcedido = mods > 3;

                    const nombreCompleto = (u.nombre || u.apellido) ? `${u.nombre} ${u.apellido}`.trim() : 'Sin nombre';

                    html += `
                        <div class="user-item ${haExcedido ? 'exceeded' : ''}">
                            <div class="user-detail">
                                <div class="avatar">${inicial}</div>
                                <div class="user-data">
                                    <h3>#${i + 1} - ${u.usuario} <span style="font-weight: 500; color: #64748b; font-size: 13px;">(${nombreCompleto})</span></h3>
                                    <p><i class="fa-solid fa-id-card"></i> C.I: ${u.ci || 'N/A'} | <i class="fa-solid fa-phone"></i> Tel: ${u.telefono || 'N/A'}</p>
                                    <p><i class="fa-solid fa-location-dot"></i> Dir: ${u.direccion || 'N/A'} | <i class="fa-solid fa-key"></i> Clave: ${u.clave}</p>
                                </div>
                            </div>
                            <div class="badges-group">
                                ${haExcedido ? `
                                    <span class="badge-alert" onclick="verHistorialEdiciones('${u.usuario}')">
                                        <i class="fa-solid fa-triangle-exclamation"></i> ¡ALERTA: +3 EDICIONES!
                                    </span>
                                ` : ''}
                                <span class="badge-mods" onclick="verHistorialEdiciones('${u.usuario}')">
                                    <i class="fa-solid fa-pen-to-square"></i> ${mods} ${mods === 1 ? 'edición' : 'ediciones'}
                                </span>
                                <button onclick="eliminarUsuario('${u.usuario}')" class="btn-delete-user" title="Eliminar usuario">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                contenedor.innerHTML = html;
            } catch (err) {
                console.error("Error al cargar usuarios:", err);
            }
        }

        function verHistorialEdiciones(usuarioNombre) {
            const user = usuariosCargados.find(u => u.usuario === usuarioNombre);
            if (!user) return;

            document.getElementById('modalTitulo').innerText = `Historial de Ediciones: ${user.usuario}`;
            const contenedor = document.getElementById('modalContenido');

            const historial = user.historialModificaciones || [];

            if (historial.length === 0) {
                contenedor.innerHTML = '<p style="text-align:center; color:#64748b;">Este usuario no ha modificado su perfil.</p>';
            } else {
                let html = '';
                historial.forEach((fecha, idx) => {
                    html += `
                        <div class="history-item">
                            <i class="fa-solid fa-clock"></i> Edición #${idx + 1}: ${fecha}
                        </div>
                    `;
                });
                contenedor.innerHTML = html;
            }

            document.getElementById('modalGenerico').classList.add('active');
        }

        function cerrarModalGenerico() {
            document.getElementById('modalGenerico').classList.remove('active');
        }

        async function eliminarUsuario(nombre) {
            if (confirm(`¿Eliminar usuario "${nombre}"?`)) {
                await fetch(`/api/usuarios/${encodeURIComponent(nombre)}`, { method: 'DELETE' });
                cargarDatos();
            }
        }

        async function vaciarBaseDeDatos() {
            if (confirm("⚠️ ¿Deseas vaciar TODOS los usuarios?")) {
                await fetch('/api/usuarios', { method: 'DELETE' });
                cargarDatos();
            }
        }

        // EXPORTAR TSV LIMPIO
        function exportarCSV() {
            if (!usuariosCargados || usuariosCargados.length === 0) {
                alert("No hay datos para exportar.");
                return;
            }

            let tsvContent = "\uFEFFUsuario\tClave\tNombre\tApellido\tC.I\tTeléfono\tDirección\tFecha Registro\tModificaciones\n";

            usuariosCargados.forEach(u => {
                tsvContent += `${u.usuario || ''}\t${u.clave || ''}\t${u.nombre || ''}\t${u.apellido || ''}\t${u.ci || ''}\t${u.telefono || ''}\t${u.direccion || ''}\t${u.fechaRegistro || ''}\t${u.contadorModificaciones || 0}\n`;
            });

            descargarArchivo(tsvContent, 'usuarios_sistema.csv', 'text/csv;charset=utf-8;');
            fetch('/api/descargas', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ formato: 'CSV' })
            });
        }

        function descargarArchivo(contenido, nombreArchivo, mimeType) {
            const blob = new Blob([contenido], { type: mimeType });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = nombreArchivo;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        async function abrirModalDescargas() {
            document.getElementById('modalTitulo').innerText = 'Historial de Descargas';
            const contenedor = document.getElementById('modalContenido');

            try {
                const res = await fetch('/api/descargas');
                const descargas = await res.json();

                if (!descargas || descargas.length === 0) {
                    contenedor.innerHTML = '<p style="text-align:center; color:#64748b;">No hay descargas registradas.</p>';
                } else {
                    let html = '';
                    descargas.forEach(d => {
                        html += `
                            <div class="history-item" style="display:flex; justify-content:space-between; align-items:center;">
                                <span><i class="fa-solid fa-download"></i> ${d.formato} - ${d.fecha} ${d.hora}</span>
                                <button onclick="eliminarDescarga('${d.id}')" style="background:transparent; border:none; color:#ef4444; cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                            </div>
                        `;
                    });
                    contenedor.innerHTML = html;
                }
            } catch (err) {
                contenedor.innerHTML = '<p style="color:red;">Error al cargar descargas.</p>';
            }

            document.getElementById('modalGenerico').classList.add('active');
        }

        async function eliminarDescarga(id) {
            await fetch(`/api/descargas/${id}`, { method: 'DELETE' });
            abrirModalDescargas();
        }
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Administrador</title>

    <!-- Google Fonts & Font Awesome Icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-dark: #0f172a;
            --card-bg: rgba(255, 255, 255, 0.96);
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border-color: #e2e8f0;
            --radius-lg: 20px;
            --radius-md: 12px;
            --danger: #ef4444;
            --warning-bg: #fef3c7;
            --warning-text: #b45309;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            min-height: 100vh;
            padding: 30px 20px;
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .admin-container {
            width: 100%;
            max-width: 780px;
        }

        /* CARD LOGIN ADMIN */
        .login-card {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 36px 30px;
            max-width: 420px;
            margin: 0 auto;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            text-align: center;
        }

        .login-card h2 {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 6px;
            color: #0f172a;
        }

        .login-card p {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
            text-align: left;
        }

        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #475569;
            margin-bottom: 6px;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-wrapper i.field-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            font-size: 15px;
        }

        .input-wrapper input {
            width: 100%;
            padding: 12px 14px 12px 40px;
            font-size: 14px;
            border: 1.5px solid var(--border-color);
            border-radius: var(--radius-md);
            background: #f8fafc;
            color: var(--text-main);
            outline: none;
        }

        .input-wrapper input:focus {
            border-color: var(--primary);
            background: #ffffff;
        }

        .btn-primary {
            width: 100%;
            padding: 13px;
            background: linear-gradient(135deg, var(--primary), var(--primary-hover));
            color: white;
            border: none;
            border-radius: var(--radius-md);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 10px;
        }

        .alert-error {
            background: #fef2f2;
            color: #b91c1c;
            border: 1px solid #fca5a5;
            padding: 10px;
            border-radius: 8px;
            font-size: 13px;
            margin-bottom: 15px;
            display: none;
        }

        /* HEADER PANEL ADMIN */
        .header-panel {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 24px 30px;
            margin-bottom: 20px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
        }

        .header-info h1 {
            font-size: 20px;
            font-weight: 800;
            color: #0f172a;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .header-info p {
            font-size: 13px;
            color: var(--text-muted);
            margin-top: 4px;
        }

        .stat-card {
            background: linear-gradient(135deg, #4f46e5, #06b6d4);
            color: white;
            padding: 16px 24px;
            border-radius: var(--radius-md);
            text-align: center;
            min-width: 160px;
            box-shadow: 0 8px 20px rgba(79, 70, 229, 0.3);
        }

        .stat-card .number {
            font-size: 32px;
            font-weight: 800;
            line-height: 1;
        }

        .stat-card .label {
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.9;
            margin-top: 4px;
        }

        .content-panel {
            background: var(--card-bg);
            border-radius: var(--radius-lg);
            padding: 26px 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .controls-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            gap: 10px;
        }

        .btn {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .btn-refresh {
            background: #f1f5f9;
            color: #334155;
        }

        .btn-refresh:hover {
            background: #e2e8f0;
        }

        .btn-danger {
            background: #fef2f2;
            color: var(--danger);
            border: 1px solid #fca5a5;
        }

        .btn-danger:hover {
            background: var(--danger);
            color: white;
        }

        .users-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .user-item {
            background: #f8fafc;
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .user-detail {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), #06b6d4);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 800;
            font-size: 18px;
        }

        .user-data h3 {
            font-size: 15px;
            font-weight: 700;
            color: #0f172a;
        }

        .user-data p {
            font-size: 12px;
            color: var(--text-muted);
            margin-top: 2px;
        }

        .badges-group {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .badge-date {
            background: #e0e7ff;
            color: var(--primary);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
        }

        .badge-mods {
            background: var(--warning-bg);
            color: var(--warning-text);
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            display: inline-flex;
            align-items: center;
            gap: 4px;
        }

        .btn-delete-user {
            background: transparent;
            color: #94a3b8;
            border: none;
            cursor: pointer;
            font-size: 16px;
            padding: 8px;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .btn-delete-user:hover {
            color: var(--danger);
            background: #fee2e2;
        }

        .empty-state {
            text-align: center;
            padding: 40px 10px;
            color: var(--text-muted);
        }

        .empty-state i {
            font-size: 40px;
            color: #cbd5e1;
            margin-bottom: 12px;
        }
    </style>
</head>

<body>

    <div class="admin-container">

        <!-- 1. FORMULARIO DE ACCESO ADMIN -->
        <div id="vistaLoginAdmin" class="login-card">
            <div style="font-size: 40px; color: var(--primary); margin-bottom: 10px;">
                <i class="fa-solid fa-user-shield"></i>
            </div>
            <h2>Acceso Administrador</h2>
            <p>Ingresa tus credenciales especiales para acceder al panel.</p>

            <div id="loginError" class="alert-error">Credenciales incorrectas</div>

            <form onsubmit="event.preventDefault(); iniciarSesionAdmin();">
                <div class="form-group">
                    <label>Usuario Administrador</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user field-icon"></i>
                        <input type="text" id="adminUser" placeholder="Usuario Admin" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock field-icon"></i>
                        <input type="password" id="adminPass" placeholder="••••••••" required>
                    </div>
                </div>

                <button type="submit" class="btn-primary">
                    <i class="fa-solid fa-right-to-bracket"></i> Ingresar al Panel
                </button>
            </form>
        </div>

        <!-- 2. PANEL COMPLETO (OCULTO HASTA INICIAR SESIÓN) -->
        <div id="vistaPanelAdmin" style="display: none;">

            <div class="header-panel">
                <div class="header-info">
                    <h1><i class="fa-solid fa-code"></i> Panel de Programador</h1>
                    <p>Monitoreo de usuarios y auditoría de ediciones</p>
                </div>
                <div style="display: flex; gap: 15px; align-items: center;">
                    <div class="stat-card">
                        <div class="number" id="totalUsuariosCount">0</div>
                        <div class="label">Usuarios Totales</div>
                    </div>
                    <button onclick="cerrarSesionAdmin()" class="btn btn-danger" style="height: fit-content;"
                        title="Cerrar sesión de admin">
                        <i class="fa-solid fa-power-off"></i>
                    </button>
                </div>
            </div>

            <div class="content-panel">
                <div class="controls-bar">
                    <span style="font-weight: 700; font-size: 15px; color: #0f172a;">Directorio y Auditoría</span>
                    <div>
                        <button onclick="cargarDatos()" class="btn btn-refresh">
                            <i class="fa-solid fa-rotate-right"></i> Actualizar
                        </button>
                        <button onclick="vaciarBaseDeDatos()" class="btn btn-danger">
                            <i class="fa-solid fa-trash-can"></i> Borrar Todo
                        </button>
                    </div>
                </div>

                <div id="contenedorLista" class="users-list"></div>
            </div>

        </div>

    </div>

    <script>
        const ADMIN_SESSION_KEY = 'admin_session_active';

        document.addEventListener('DOMContentLoaded', () => {
            const esAdmin = sessionStorage.getItem(ADMIN_SESSION_KEY);
            if (esAdmin) {
                mostrarPanelAdmin();
            }
        });

        async function iniciarSesionAdmin() {
            const usuario = document.getElementById('adminUser').value.trim();
            const clave = document.getElementById('adminPass').value.trim();
            const errorElem = document.getElementById('loginError');

            errorElem.style.display = 'none';

            try {
                const response = await fetch('/api/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, clave })
                });

                if (response.ok) {
                    sessionStorage.setItem(ADMIN_SESSION_KEY, 'true');
                    mostrarPanelAdmin();
                } else {
                    errorElem.style.display = 'block';
                }
            } catch (err) {
                alert("Error al conectar con el servidor.");
            }
        }

        function mostrarPanelAdmin() {
            document.getElementById('vistaLoginAdmin').style.display = 'none';
            document.getElementById('vistaPanelAdmin').style.display = 'block';
            cargarDatos();
        }

        function cerrarSesionAdmin() {
            sessionStorage.removeItem(ADMIN_SESSION_KEY);
            document.getElementById('vistaPanelAdmin').style.display = 'none';
            document.getElementById('vistaLoginAdmin').style.display = 'block';
            document.getElementById('adminUser').value = '';
            document.getElementById('adminPass').value = '';
        }

        async function cargarDatos() {
            const contadorElem = document.getElementById('totalUsuariosCount');
            const contenedor = document.getElementById('contenedorLista');

            try {
                const response = await fetch('/api/usuarios');
                const usuarios = await response.json();

                contadorElem.textContent = usuarios.length;

                if (!usuarios || usuarios.length === 0) {
                    contenedor.innerHTML = `
                        <div class="empty-state">
                            <i class="fa-solid fa-users-slash"></i>
                            <p>No hay usuarios registrados en la base de datos.</p>
                        </div>
                    `;
                    return;
                }

                let html = '';
                usuarios.forEach((u, index) => {
                    const inicial = u.usuario ? u.usuario.charAt(0).toUpperCase() : '?';
                    const ediciones = u.contadorModificaciones || 0;

                    html += `
                        <div class="user-item">
                            <div class="user-detail">
                                <div class="avatar">${inicial}</div>
                                <div class="user-data">
                                    <h3>#${index + 1} - ${u.usuario}</h3>
                                    <p><i class="fa-solid fa-phone"></i> Tel: ${u.telefono || 'Sin teléfono'} | <i class="fa-solid fa-key"></i> Clave: ${u.clave}</p>
                                    ${u.direccion ? `<p><i class="fa-solid fa-location-dot"></i> ${u.direccion}</p>` : ''}
                                </div>
                            </div>
                            <div class="badges-group">
                                <span class="badge-mods" title="Ediciones realizadas">
                                    <i class="fa-solid fa-pen-to-square"></i> ${ediciones} ${ediciones === 1 ? 'edición' : 'ediciones'}
                                </span>
                                <span class="badge-date">${u.fechaRegistro || 'Sin fecha'}</span>
                                <button onclick="eliminarUsuario('${u.usuario}')" class="btn-delete-user" title="Eliminar usuario">
                                    <i class="fa-solid fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `;
                });

                contenedor.innerHTML = html;
            } catch (err) {
                console.error("Error al cargar los usuarios:", err);
            }
        }

        async function eliminarUsuario(nombre) {
            if (confirm(`¿Estás seguro de que deseas eliminar al usuario "${nombre}"?`)) {
                try {
                    await fetch(`/api/usuarios/${encodeURIComponent(nombre)}`, {
                        method: 'DELETE'
                    });
                    cargarDatos();
                } catch (err) {
                    alert("Error al eliminar el usuario");
                }
            }
        }

        async function vaciarBaseDeDatos() {
            if (confirm("⚠️ ADVERTENCIA: ¿Estás seguro de que deseas borrar TODOS los usuarios del sistema?")) {
                try {
                    await fetch('/api/usuarios', {
                        method: 'DELETE'
                    });
                    cargarDatos();
                } catch (err) {
                    alert("Error al vaciar la base de datos");
                }
            }
        }
    </script>

</body>

</html>
